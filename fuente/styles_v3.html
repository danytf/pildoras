<style>
/* Concepto: ficha Wesser llevada al móvil. Cabecera roja con franja diagonal, una columna, bloques que se tocan (pestañas, campos) y una caja de acción roja. */
:root{
  --bg:#FFFFFF; --surface:#F5F2ED; --soft:#F0ECE6; --ink:#151313; --muted:#5B5551; --line:#DDD7CF; --stripe:#DDD7CF;
  --red:#E51B1B; --red-text:#B30F14; --tint:#FDECEE; --ok:#1B7A4B; --focus:#151313;
  --inv-bg:#F5F2ED; --inv-ink:#151313; --inv-accent:#B30F14;
  --r:8px;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141212; --surface:#1E1B1B; --soft:#2A2626; --ink:#F2F0F0; --muted:#B8B1AB; --line:#3A3436; --stripe:#3A3436;
    --red-text:#FF7780; --tint:#2B1719; --ok:#2A9461; --focus:#F2F0F0;
    --inv-bg:#1E1B1B; --inv-ink:#F2F0F0; --inv-accent:#FF7780;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141212; --surface:#1E1B1B; --soft:#2A2626; --ink:#F2F0F0; --muted:#B8B1AB; --line:#3A3436; --stripe:#3A3436;
  --red-text:#FF7780; --tint:#2B1719; --ok:#2A9461; --focus:#F2F0F0;
  --inv-bg:#1E1B1B; --inv-ink:#F2F0F0; --inv-accent:#FF7780;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
svg{display:block}

/* cabecera */
.top{position:relative;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));overflow:hidden;background:var(--surface);border-bottom:1px solid var(--line)}
.top::before{content:"";position:absolute;inset:0 0 0 auto;width:62%;background:var(--red);clip-path:polygon(34% 0,100% 0,100% 100%,0 100%)}
.top::after{content:"";position:absolute;inset:0 0 0 auto;width:62%;background:var(--red);opacity:.9;clip-path:polygon(0 0,6% 0,-28% 100%,-34% 100%)}
.top-in{position:relative;max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:1}
.logo{background:#fff;border-radius:var(--r);padding:6px 10px;width:132px;flex:none}
.logo img{width:100%;height:auto}
.tag{text-align:right;color:#fff;font-family:var(--f-display);font-weight:800;line-height:1;min-width:0}
.tag b{display:block;font-size:30px;letter-spacing:.8px}
.tag span{display:block;font-size:16px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;margin-top:3px}
.tag small{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.6px;margin-top:5px}
.tag small svg{width:12px;height:12px}

/* progreso */
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.prog-in{max-width:640px;margin:0 auto}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--muted)}
.prog-row output{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);border-radius:3px;transition:width .35s ease}

/* tipografía */
h1{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(46px,13vw,66px);line-height:.96;margin:26px 0 0;text-wrap:balance}
h1 em{display:block;font-style:normal;color:var(--red-text)}
.sub{font-size:13.5px;font-weight:600;color:var(--muted);margin:10px 0 0}
.gancho{background:var(--tint);border-left:6px solid var(--red);border-radius:0 var(--r) var(--r) 0;padding:16px 18px;font-weight:700;font-size:17.5px;line-height:1.4;margin:22px 0 0}
.lab{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:24px;letter-spacing:1.2px;color:var(--red-text);margin:0}
.lab::after{content:"";flex:1;height:2px;background:var(--line)}
section{margin-top:34px}
section>p.lead{margin:6px 0 0;color:var(--muted);font-size:14px;font-weight:600}

/* idea clave */
.duo{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media (min-width:520px){.duo{grid-template-columns:1fr 1fr}}
.duo>div{border-radius:var(--r);padding:14px 16px;min-width:0}
.duo h3{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:1px;text-transform:uppercase;margin:0 0 4px}
.duo h3 svg{width:20px;height:20px}
.duo p{margin:0;font-size:16px;font-weight:500;line-height:1.45}
.no{background:var(--soft)}.no h3{color:var(--muted)}
.si{border:2px solid var(--red);background:var(--surface)}.si h3{color:var(--red-text)}

/* pestañas */
.caso{margin:8px 0 0;font-size:14px;font-weight:600;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;
  font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:1px;text-transform:uppercase;line-height:1;min-height:44px;color:var(--ink)}
.tab svg{width:24px;height:24px;color:var(--red-text)}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tab[aria-selected="true"] svg{color:#fff}
.tab .v{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tab.seen .v{background:var(--red)}
.tab[aria-selected="true"] .v{background:#fff}
.panel{border:2px solid var(--red);border-radius:var(--r);margin-top:10px;overflow:hidden;background:var(--surface)}
.panel p{margin:0;padding:16px 16px 14px;font-size:17px;font-weight:500;line-height:1.45}
.panel .ex{background:var(--soft);padding:12px 16px 14px;font-weight:700;font-size:15.5px;line-height:1.4}
.panel .ex b{display:block;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:14px;color:var(--red-text);margin-bottom:2px}

/* mini-práctica */
.qs{display:grid;gap:14px;margin-top:12px}
.q{border:2px dashed var(--red);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.q label{display:flex;gap:10px;align-items:flex-start;font-weight:800;font-size:17px;line-height:1.3}
.q label span.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.q .h{margin:4px 0 0 36px;font-size:13px;color:var(--muted);font-weight:500}
.q .eg{margin:4px 0 8px 36px;font-size:13.5px;color:var(--red-text);font-weight:600;font-style:italic}
.q textarea{display:block;width:100%;min-height:76px;resize:vertical;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg);font-size:16px;line-height:1.4}
.q textarea::placeholder{color:var(--muted);opacity:.8}
.save{min-height:20px;margin:10px 0 0;font-size:12.5px;font-weight:600;color:var(--muted)}

/* acción */
.accion{background:var(--red);color:#fff;border-radius:var(--r);padding:18px 18px 16px;margin-top:34px}
.accion h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:1.4px;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:10px}
.accion h2 svg{width:26px;height:26px}
.accion p{margin:6px 0 14px;font-weight:700;font-size:17.5px;line-height:1.4}
.chk{display:flex;align-items:center;gap:12px;background:#fff;color:#151313;border-radius:var(--r);padding:12px 14px;font-weight:700;font-size:15.5px;cursor:pointer;min-height:48px}
.chk input{width:22px;height:22px;accent-color:#E51B1B;flex:none;margin:0}
.rev{background:var(--soft);border-radius:var(--r);padding:14px 18px;margin-top:12px;font-weight:500;font-size:15.5px;line-height:1.45}
.rev b{display:block;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:1.2px;font-size:20px;color:var(--red-text);margin-bottom:2px}
.frase{background:var(--inv-bg);color:var(--inv-ink);border-radius:var(--r);padding:18px 20px;margin-top:12px;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.18;letter-spacing:.3px}

/* pie */
.pie{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.reset{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.btn svg{width:16px;height:16px}
.btn.danger{border-color:var(--red);color:var(--red-text)}
.reset span{font-size:13.5px;font-weight:600}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* casillas (píldora 2) */
.cas{display:grid;gap:10px;margin-top:12px}
.cas-i{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.cas-i[data-v="bien"]{border-color:var(--ok)}
.cas-i[data-v="olv"]{border-color:var(--red)}
.cas-h{display:flex;gap:12px;align-items:flex-start}
.ci{flex:none;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
.ci svg{width:19px;height:19px}
.cas-h h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.8px;text-transform:uppercase;line-height:1.05}
.cas-h p{margin:3px 0 0;font-size:15px;font-weight:500;line-height:1.4}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.seg button{min-height:44px;border:2px solid var(--line);border-radius:var(--r);background:var(--bg);font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;line-height:1.2}
.seg button svg{width:16px;height:16px;flex:none}
.seg button.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.ol[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{min-height:44px;border:2px solid var(--line);border-radius:22px;background:var(--surface);padding:8px 16px;font-weight:700;font-size:14.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.nota{margin:12px 0 0;font-size:14px;font-weight:600;color:var(--muted)}
.elegida{margin:12px 0 0;font-weight:800;font-size:15px;color:var(--red-text);min-height:22px}
@media (min-width:520px){.cas{grid-template-columns:1fr 1fr}}

/* índice de la serie */
.intro{margin:22px 0 0;font-size:17px;font-weight:600;line-height:1.45}
.idx{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:14px}
.card-top>div{min-width:0}
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;min-height:44px}
.card:hover{border-color:var(--red)}
.card-top{display:flex;align-items:center;gap:14px}
.num{flex:none;width:54px;height:54px;border-radius:var(--r);background:var(--red);color:#fff;font-family:var(--f-display);font-weight:800;font-size:32px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
.card h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:27px;line-height:1.02;text-transform:uppercase;letter-spacing:.5px}
.card small{display:block;margin-top:4px;font-size:12.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.card .go{margin-left:auto;flex:none;color:var(--red-text)}
.card .go svg{width:24px;height:24px}
.card .st{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.card .st output{color:var(--ink);font-variant-numeric:tabular-nums}
.card .bar{margin-top:5px}
.card p{margin:10px 0 0;font-size:15px;font-weight:500;line-height:1.4}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:14px;font-weight:700;color:var(--red-text);text-decoration:none;min-height:44px}
.back svg{width:16px;height:16px}
.navp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.navp .btn{text-decoration:none;justify-content:center;text-align:center}
.navp .btn.next{background:var(--red);border-color:var(--red);color:#fff}
h1:focus{outline:none}
a.chip{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.ruta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.ruta i{font-style:normal;color:var(--muted);font-weight:800}
.planc{display:block;text-decoration:none;color:#fff;background:var(--red);border-radius:var(--r);padding:16px;margin-top:12px}
.planc b{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:1.2px;text-transform:uppercase}
.planc b svg{width:26px;height:26px}
.planc p{margin:6px 0 10px;font-weight:600;font-size:15.5px;line-height:1.4}
.planc output{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.planc .bar{background:rgba(255,255,255,.3)}
.planc .bar i{background:#fff}
.pg{margin-top:26px}
.pg h2{margin:0}
.pr{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:10px;min-width:0}
.pr small{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--red-text)}
.pr small a{color:var(--muted);text-decoration:none;font-weight:700}
.pr p{margin:4px 0 0;font-size:16px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.pr.vacio{border-style:dashed}
.pr.vacio p{color:var(--muted);font-weight:500;font-style:italic}
.pr.vacio p a{color:var(--red-text);font-weight:700}
.copia{display:grid;gap:10px;margin-top:22px}
.acts{display:flex;flex-wrap:wrap;gap:10px}.acts .btn{text-decoration:none}
.save a{color:var(--red-text);font-weight:700}
.copia textarea{width:100%;min-height:140px;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg);font-size:14px}
.how{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.how li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:15px;font-weight:500;line-height:1.4}
.how b{display:block;font-weight:800;font-size:16px;margin-bottom:1px}
.how .hn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--f-display);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.q .ql{display:flex;gap:10px;align-items:flex-start;font-weight:800;font-size:17px;line-height:1.3}
.q .ql span.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.zs{display:grid;gap:10px;margin-top:12px}
.z-i{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.z-i b{display:block;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.8px;text-transform:uppercase;line-height:1.05}
.z-i span{display:block;margin-top:3px;font-size:15.5px;font-weight:500;line-height:1.4}
.ok2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px}
.ok2 button{min-width:0;line-height:1.15;min-height:44px;border:2px solid var(--line);border-radius:var(--r);background:var(--bg);font-weight:800;font-size:14px;cursor:pointer;padding:6px 8px}
.ok2 button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
.tab{min-width:0;font-size:18px;padding:12px 4px;text-align:center;overflow-wrap:normal}
.tag b{font-size:26px}
.cs{display:grid;gap:12px;margin-top:12px}
.cs-i{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.cs-i h3{margin:0;font-weight:700;font-size:16.5px;line-height:1.4}
.cs-i .n{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--red-text);display:block;margin-bottom:2px}
.opt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.opt3 button{min-height:44px;border:2px solid var(--line);border-radius:var(--r);background:var(--bg);font-weight:800;font-size:13.5px;cursor:pointer;padding:6px 4px;line-height:1.15}
.opt3 button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.lect{margin:10px 0 0;font-size:14.5px;font-weight:600;line-height:1.45;min-height:0}
.lect:empty{display:none}
.z-i b.sent{font-family:var(--f-body);font-size:16.5px;font-weight:700;text-transform:none;letter-spacing:0;line-height:1.4}</style>

<style id="adapt-pantalla">
/* Adaptación a pantalla: móvil (base), tablet y ordenador */
@media (min-width:760px){
  body{font-size:17px}
  .wrap,.top-in,.prog-in{max-width:min(1040px,100%)}
  .logo{width:160px}
  .tag b{font-size:32px}
  .tag span{font-size:18px}
  h1{font-size:clamp(64px,8vw,88px)}
  .sub{font-size:15px}
  .intro{font-size:19px;max-width:72ch}
  .gancho{font-size:20px;padding:20px 26px}
  section>p.lead,.nota{max-width:72ch}
  .idx{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .how{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
  .how.tema{grid-template-columns:repeat(2,minmax(0,1fr))}
  .zs,.cs,.cas{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
  .qs{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-items:start}
  .navp{max-width:560px;margin-left:auto;margin-right:auto}
  #plan-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:0 28px;align-items:start}
  .copia{max-width:720px}
}
@media (min-width:1100px){
  .wrap,.top-in,.prog-in{max-width:1200px}
  .idx{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:44px;align-items:start}
  .cols .accion{margin-top:34px}
}
@media (min-width:1100px) and (min-height:780px){
  .col-b{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
}
</style>
<style id="estilo-wesser">
/* Estilo visual Wesser (skill wesser-estilo-visual) */
header.top{background:var(--bg)}
