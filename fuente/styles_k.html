<style id="conoc">
.datos{display:grid;gap:10px;margin-top:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.datos.d3{grid-template-columns:repeat(3,minmax(0,1fr))}
.datos>div{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 10px;min-width:0}
.datos>div:last-child:nth-child(odd):not(:first-child){grid-column:1/-1}
.datos b{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,8vw,36px);line-height:1.05;color:var(--red-text);overflow-wrap:anywhere}
.datos.d3 b{text-align:center}.datos.d3 span{text-align:center}
.datos span{display:block;margin-top:6px;font-size:13.5px;font-weight:700;line-height:1.3}
.bars{margin-top:14px}.bars .t{height:14px;border-radius:7px;background:var(--line);display:flex;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--red)}.bars .t i:nth-child(2){background:#7a7a7a}.bars .t i:nth-child(3){background:#bdbdbd}
.decir{background:var(--tint);border-left:6px solid var(--red);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;margin-top:12px}
.decir small{display:block;font-family:var(--f-display);font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--red-text);font-size:15px}
.decir p{margin:6px 0 0;font-weight:700;font-size:17px;line-height:1.4}
.faq{margin-top:12px;display:grid;gap:10px}
.faq>div{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.faq b{display:block;font-size:16px;line-height:1.35}
.faq p{margin:6px 0 0;font-size:15px;line-height:1.45;font-weight:600}
.decir.cso p{font-weight:500;font-size:16px}
.backrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sos-mini{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:18px;border:2px solid var(--red);background:var(--bg);color:var(--red-text);border-radius:var(--r);padding:6px 12px;font-weight:800;font-size:14px;cursor:pointer}
.sos-mini svg{width:18px;height:18px}
.sos-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin-top:18px;border:2px solid var(--red);background:var(--tint);color:var(--ink);border-radius:var(--r);padding:10px 14px;cursor:pointer;text-align:left;font:inherit}
.sos-btn svg{width:26px;height:26px;flex:none;color:var(--red-text)}
.sos-btn b{display:block;font-family:var(--f-display);font-size:22px;text-transform:uppercase;color:var(--red-text)}
.sos-btn small{display:block;font-weight:600;font-size:14px}
.sos{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto}
.sos[hidden]{display:none}
.sos-in{max-width:760px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.sos-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:2;background:var(--bg);margin:-18px 0 0;padding:max(14px,env(safe-area-inset-top,0px)) 0 10px;border-bottom:2px solid var(--tint)}
.sos-h h2{margin:0;font-family:var(--f-display);font-size:34px;text-transform:uppercase;color:var(--red-text)}
.sos h3{font-family:var(--f-display);font-size:22px;text-transform:uppercase;margin:22px 0 8px}
.sos-r{background:var(--tint);border-left:6px solid var(--red);border-radius:0 var(--r) var(--r) 0;padding:10px 14px;margin-top:8px}
.sos-r b{display:block;font-weight:800}
.sos-r p{margin:4px 0 0;font-size:15.5px;line-height:1.45}
</style>
<style>.card h3,.card small,.card .ct,.idx h3{overflow-wrap:anywhere;hyphens:auto}.card-top h3{font-size:clamp(17px,5.4vw,20px)}</style>
<style id="ok2fix">.ok2 button{overflow-wrap:anywhere}@media(max-width:360px){.ok2[style*="repeat(3"]{grid-template-columns:minmax(0,1fr)!important}}</style>
